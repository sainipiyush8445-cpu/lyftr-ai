services:
  - type: web
    name: lyftr-ai-backend
    runtime: python
    region: oregon
    # Free plan (ephemeral SQLite in /tmp). For persistent storage across restarts,
    # upgrade to 'plan: starter', set DATABASE_URL to sqlite:////data/app.db, and add a disk block at /data.
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    rootDir: backend
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.0
      - key: GEMINI_API_KEY_1
        sync: false
      - key: GEMINI_API_KEY_2
        sync: false
      - key: GEMINI_MODEL
        value: gemini/gemini-3.5-flash
      - key: DATABASE_URL
        value: sqlite:////tmp/app.db
      - key: ENABLE_FAILURE_SIMULATION
        value: "false"
      - key: CORS_ORIGINS
        # Replace with your deployed Vercel frontend origin
        value: "*"
      - key: LOG_LEVEL
        value: "INFO"
